kind = "web"
previewPath = "/driver/"
title = "Yardflow Driver PWA"
version = "1.0.0"
id = "artifacts/driver-pwa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/driver/" ]
localPort = 18583

[services.development]
run = "pnpm --filter @workspace/driver-pwa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/driver-pwa", "run", "build" ]
publicDir = "artifacts/driver-pwa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18583"
BASE_PATH = "/driver/"
